# Baseline TransAttUNet Experiment Configuration (Phase 2)
model:
  name: "transattunet"
  in_channels: 3
  num_classes: 1
  bilinear: true

data:
  image_size: 256
  train_split: "data/splits/train.json"
  val_split: "data/splits/val.json"
  batch_size: 4
  num_workers: 0

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  seed: 42
  device: "auto"

loss:
  name: "dice_bce"
  bce_weight: 1.0
  dice_weight: 1.0

checkpoint:
  directory: "checkpoints"
  save_best_only: true
  best_filename: "transattunet_baseline_best.pth"
  latest_filename: "transattunet_baseline_latest.pth"

logging:
  log_dir: "results/logs"
  figures_dir: "results/figures"
  metrics_json: "results/logs/train_metrics.json"
  metrics_csv: "results/logs/train_metrics.csv"
  plot_path: "results/figures/training_curves.png"
